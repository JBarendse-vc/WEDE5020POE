<!DOCTYPE html> <!--(The IIE, 2026)--> <!--Ensures browser adheres to standard mode, which is best practice-->
<html lang="en">  <!--(The IIE, 2026)--> <!--Lets the HTML infrastructure know the langugae selected for this is english-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body> <!--(The IIE, 2026)--> <!--Houses all content for HTML code-->
    <header> <!--(The IIE, 2026)-->  <!--Provides the heading of the webpage and marks the start of the webpage-->
        <img src="../Images/logo.png" class="logo" alt="Beesland Butchery Logo">
        <p> <!--(The IIE, 2026)--> <!--Paragraph tag is used to group text content of the webpage-->
            <a href="index.html">Home</a> | <!--(The IIE, 2026)--> <!-- Anchor tag provides links to access other webpages related to this or other websites-->
            <a href="products.html">Products</a> |
            <a href="contact.html">Contact Us</a> |
            <a href="about.html">About us</a> |
            <a href="testimonial.html">Testimonial</a>
        </p>
    </header>
    <div> <!--(The IIE, 2026)--> <!--Div tag is used to group together the content of the webpage-->
        <h1 style="text-align: center;"> <!--(The IIE, 2026)--> <!--Utilizes largest heading feature-->
           Meat Products
        </h1>
    </div>
        <div class="boxes"> <!--(The IIE, 2026)--> <!--Div tag is used to group together the content of the webpage--> <!-- Styles allow to decorate the content of the webpage -->
            <div class="box">
                <h3>Lamb</h3>
                <img src="../Images/lamb.jpg" alt="Lamb" style="width: 150px;height: 150px;"> <!--(The IIE, 2026)--> <!--Image tag is used to display an image on the webpage, in this case it's a gif of a lamb-->
                <p>
                    Price: R250 per kg
                </p>
            </div>
            <div class="box">
                <h3>Beef</h3>
                <img src="../Images/beef (1).jpg" alt="Beef" style="width: 150px;height: 150px;">
                <p>
                    Price: R500 per kg
                </p>
            </div>
            <div class="box">
                <h3>Polony</h3>
                <img src="../Images/polony.jpg" alt="Polony" style="width: 150px;height: 150px;"> <!--(The IIE, 2026)-->
                <p>
                    Price: R80 per kg
                </p>
            </div>
            <div class="box">
                <h3>Biltong</h3>
                <img src="../Images/biltong.jpg" alt="Biltong" style="width: 150px;height: 150px;"> 
                <p>
                    Price: R150 per 2kg                                               
                </p>
            </div>
        </div>
        <footer>  <!--(The IIE, 2026)--> <!--Provides the footer of the webpage and marks the end of the webpage-->
        <p>
            &copy; 2026 Beesland Butchery. All rights reserved. 
        </p>
    </footer>
</body>
</html>
