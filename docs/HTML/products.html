<!DOCTYPE html> <!--(The IIE, 2026)--> <!--Ensures browser adheres to standard mode, which is best practice-->
<html lang="en">  <!--(The IIE, 2026)--> <!--Lets the HTML infrastructure know the langugae selected for this is english-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products at Beesland Butchery</title>
    <link rel="stylesheet" href="../css/style.css">
    <meta name="keywords" content="Biltong, Beef, Lamb, Polony, meat products,boerewors, butchery, animal products,meat quality control, Jeffreys Bay,Eastern Cape, South Africa,droëwors, boerewors,, premium cuts, premium meat, fresh meat, local butchery, Beesland products, Beesland website, Beesland butchery ">
    <!-- (The IIE, 2026) Meta tags are implement for Search Engine Optimization -->
</head>
<body> <!--(The IIE, 2026)--> <!--Houses all content for HTML code-->
    <main class="content"> <!--(The IIE, 2026)--> <!--Main tag is used to group together the content of the webpage-->
        <header> <!--(The IIE, 2026)-->  <!--Provides the heading of the webpage and marks the start of the webpage-->
            <img src="../Images/logo.png" class="logo" alt="Beesland Butchery Logo">
            <nav> <!--(The IIE, 2026)--> <!--Paragraph tag is used to group text content of the webpage-->
                <a href="index.html">Home</a> | <!--(The IIE, 2026)--> <!-- Anchor tag provides links to access other webpages related to this or other websites-->
                <a href="products.html">Products</a> |
                <a href="enquiry.html">Enquiry</a>
                <a href="contact.html">Contact Us</a> |
                <a href="about.html">About us</a> |
                <a href="testimonial.html">Testimonial</a>
            </nav>
        </header>
        <div> <!--(The IIE, 2026)--> <!--Div tag is used to group together the content of the webpage-->
            <h1 > <!--(The IIE, 2026)--> <!--Utilizes largest heading feature-->
            Meat Products
            </h1>
        </div> <!--(The IIE, 2026)--> <!--Div tag is used to group together the content of the webpage-->
        <label for="searchbar">Search products:</label>
        <input type="text" id="searchbar" onkeyup="search_product()" placeholder="Type a product, e.g. lamb">
        <p id="noResults" style="display:none;">No products found.</p>
        <div> <!--(The IIE, 2026)--> <!--The table tag holds and displays data in the rows and  the columns. th tag is the header of the cells (column) and td is the data of the cells (row)-->
            <table id="productSearch">
                <caption>Our Price List !</caption> <!--Caption tag  provides the tables title-->
                <tr><th>Image</th><th>Product</th><th>Price</th></tr>
                <tr class="product"><td><img src="../Images/lamb.jpg" alt="Lamb"></td><td>Lamb</td><td>R250 per kg</td></tr> <!--(Unsplash, n.d.)-->
                <tr class="product"><td><img src="../Images/beef.jpg" alt="Beef"></td><td>Beef</td><td>R500 per kg</td></tr> <!--(Unsplash, n.d.)-->
                <tr class="product"><td><img src="../Images/polony.jpg" alt="Polony"></td><td>Polony</td><td>R80 per kg</td></tr> <!--(Unsplash, n.d.)-->
                <tr class="product"><td><img src="../Images/biltong.jpg" alt="Biltong"></td><td>Biltong</td><td>R150 per 2kg</td></tr> <!--(Unsplash, n.d.)-->
            </table>
        </div>
        <footer>  <!--(The IIE, 2026)--> <!--Provides the footer of the webpage and marks the end of the webpage-->
                &copy; 2026 Beesland Butchery. All rights reserved. 
        </footer>
    </main>
    <script src="../JavaScript/Validation.js"></script>
</body>
</html>
